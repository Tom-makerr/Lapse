<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Lapse">
  <title>Lapse</title>
  <!-- Le ticket de caisse qui retombe en L. Les couleurs suivent le thème du système. -->
  <style>
    :root { color-scheme: light dark; }
    .t1 { stop-color: #FFFFFF }
    .t2 { stop-color: #EBEEF4 }
    .i1 { stop-color: #0E9FBF }
    .i2 { stop-color: #06708A }
    .core { fill: #06708A; opacity: .5 }
    .rule { fill: #FFFFFF; opacity: .82 }
    .edge { fill: none; stroke: rgba(60,60,67,.16); stroke-width: 1 }
    @media (prefers-color-scheme: dark) {
      .t1 { stop-color: #2A2F3A }
      .t2 { stop-color: #13161C }
      .i1 { stop-color: #5FD0E8 }
      .i2 { stop-color: #7ADAEE }
      .core { fill: #7ADAEE; opacity: .5 }
      .edge { stroke: rgba(255,255,255,.15) }
    }
  </style>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
      <stop class="t1" offset="0"/><stop class="t2" offset="1"/>
    </linearGradient>
    <linearGradient id="ink" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop class="i1" offset="0"/><stop class="i2" offset="1"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="46" height="46" rx="12.5" fill="url(#tile)"/>
  <g fill="url(#ink)">
    <path d="M15.5 13.5 H25 V31 H34 l2.3 2 l-2.3 2 l2.3 2 l-2.3 2 H15.5 Z"/>
    <rect x="13" y="8.6" width="14" height="6.3" rx="3.15"/>
  </g>
  <ellipse class="core" cx="15.9" cy="11.75" rx="2.1" ry="3.15"/>
  <g class="rule">
    <rect x="17.7" y="17.8" width="5.2" height="1.5" rx="0.75"/>
    <rect x="17.7" y="21.2" width="5.2" height="1.5" rx="0.75"/>
    <rect x="17.7" y="24.6" width="5.2" height="1.5" rx="0.75"/>
  </g>
  <rect class="edge" x="1.5" y="1.5" width="45" height="45" rx="12"/>
</svg>
